{% if section.data %}
<section class="overflow-hidden border-y border-white/10 bg-night-800/60 py-7" aria-label="{{ section.title|default:'Nos domaines' }}">
  <div class="marquee" aria-hidden="true">
    {% for copy in "12" %}{% for domain in section.data %}
    <a href="{{ domain.get_absolute_url }}" tabindex="-1" class="flex items-center gap-12 font-display text-3xl sm:text-5xl {% cycle 'text-white' 'text-outline' %} transition hover:text-primary-400">
      <span>{{ domain.name }}</span>
      <svg viewBox="0 0 24 24" class="size-6 shrink-0 text-primary-400 sm:size-8" fill="currentColor"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>
    </a>
    {% endfor %}{% endfor %}
  </div>
  <ul class="sr-only">{% for domain in section.data %}<li><a href="{{ domain.get_absolute_url }}">{{ domain.name }}</a></li>{% endfor %}</ul>
</section>
{% endif %}
