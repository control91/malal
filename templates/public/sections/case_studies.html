{% if section.data %}
<section class="section {{ section|theme_class }}" {% if section.anchor %}id="{{ section.anchor }}"{% endif %}>
  <div class="container-x">
    {% include "public/includes/section_heading.html" %}
    <div class="mt-14 grid gap-6 md:grid-cols-2 lg:grid-cols-3">{% for case in section.data %}{% include "public/includes/case_card.html" %}{% endfor %}</div>
  </div>
</section>
{% endif %}
