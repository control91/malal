{% if section.data %}
<section class="section {{ section|theme_class }}" {% if section.anchor %}id="{{ section.anchor }}"{% endif %}>
  <div class="container-x">
    {% include "public/includes/section_heading.html" %}
    <div class="mt-14 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      {% for t in section.data %}
      <figure class="card flex flex-col" data-reveal>
        {% icon "quote" "size-8 text-primary/40" %}
        <blockquote class="mt-4 flex-1 text-[0.95rem] leading-relaxed text-slate-300">« {{ t.quote }} »</blockquote>
        <figcaption class="mt-6 flex items-center gap-3 border-t border-white/10 pt-5">
          {% if t.photo %}<img src="{{ t.photo.url }}" alt="" class="size-11 rounded-full object-cover" loading="lazy" width="44" height="44">{% else %}<span class="grid size-11 place-items-center rounded-full bg-primary/10 text-sm font-bold text-primary-400">{{ t.author_name|initials }}</span>{% endif %}
          <span><span class="block text-sm font-semibold text-white">{{ t.author_name }}</span><span class="block text-xs text-slate-500">{{ t.author_role }}{% if t.organization %} · {{ t.organization }}{% endif %}</span></span>
        </figcaption>
      </figure>
      {% endfor %}
    </div>
  </div>
</section>
{% endif %}
