<section class="section-sm {{ section|theme_class }}" {% if section.anchor %}id="{{ section.anchor }}"{% endif %}>
  <div class="container-x max-w-3xl">
    {% include "public/includes/section_heading.html" with align="left" %}
    {% if section.body %}<div class="prose-brand prose-lg mt-8" data-reveal>{{ section.body|safe }}</div>{% endif %}
    {% if section.cta_label %}<a href="{{ section.cta_url }}" class="btn btn-primary mt-8">{{ section.cta_label }} {% icon "arrow-right" "size-4" %}</a>{% endif %}
  </div>
</section>
