{% if section.data %}
<section class="section {{ section|theme_class }}" {% if section.anchor %}id="{{ section.anchor }}"{% endif %}>
  <div class="container-x grid gap-12 lg:grid-cols-12">
    <div class="lg:col-span-4">{% include "public/includes/section_heading.html" with align="left" %}<a href="/faq/" class="link-arrow mt-6">Toutes les questions {% icon "arrow-right" "size-4" %}</a></div>
    <div class="lg:col-span-8">{% include "public/includes/faq_list.html" with faqs=section.data open_first=True %}</div>
  </div>
</section>
{% endif %}
