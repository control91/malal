{% if section.data %}
<section class="section-sm {{ section|theme_class }}" {% if section.anchor %}id="{{ section.anchor }}"{% endif %}>
  <div class="container-x">
    {% include "public/includes/section_heading.html" %}
    <ul class="mt-10 flex flex-wrap items-center justify-center gap-x-12 gap-y-8">
      {% for partner in section.data %}
      <li><a href="{{ partner.url|default:'#' }}" {% if partner.url %}target="_blank" rel="noopener"{% endif %} class="block opacity-70 grayscale transition hover:opacity-100 hover:grayscale-0">
        {% if partner.logo %}<img src="{{ partner.logo.url }}" alt="{{ partner.name }}" class="h-10 w-auto" loading="lazy" height="40">{% else %}<span class="font-display text-lg font-bold text-slate-500">{{ partner.name }}</span>{% endif %}
      </a></li>
      {% endfor %}
    </ul>
  </div>
</section>
{% endif %}
