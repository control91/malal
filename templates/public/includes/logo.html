{# Brand logo: uploaded file if any, otherwise the built-in MALAL mark + company name. `dark` = on a dark background. #}
{% load static %}
{% if dark and site.logo_dark %}<img src="{{ site.logo_dark.url }}" alt="{{ site.company_name }}" class="h-8 w-auto" width="140" height="32">
{% elif not dark and site.logo %}<img src="{{ site.logo.url }}" alt="{{ site.company_name }}" class="h-8 w-auto" width="140" height="32">
{% else %}
<span class="inline-flex items-center gap-3">
  <img src="{% static 'img/logo-mark.svg' %}" alt="" class="h-7 w-auto shrink-0" width="50" height="28">
  <span class="font-display text-xl font-extrabold tracking-tight {% if dark %}text-white{% else %}text-ink{% endif %}">{{ site.company_name }}</span>
</span>
{% endif %}
