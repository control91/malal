{% load i18n %}
<form method="post" action="{% url 'crm:newsletter_subscribe' %}" hx-post="{% url 'crm:newsletter_subscribe' %}" hx-swap="outerHTML" class="mt-4 space-y-3" >
  {% csrf_token %}
  {% include "public/includes/antispam_fields.html" %}
  <label for="nl-email" class="sr-only">{% translate "Adresse email" %}</label>
  <div class="flex items-center gap-2 border-b border-white/20 pb-1 transition focus-within:border-primary-400">
    <input id="nl-email" name="email" type="email" required autocomplete="email" placeholder="{% translate 'Votre adresse email' %}" class="min-w-0 flex-1 border-0 bg-transparent px-0 py-3 text-white placeholder:text-slate-500 focus:ring-0 focus:outline-none">
    <button class="grid size-10 place-items-center rounded-full text-primary-400 transition hover:bg-primary hover:text-white" type="submit" aria-label="{% translate "S'inscrire" %}">{% icon "send" "size-5" %}</button>
  </div>
  <label class="flex items-start gap-2 text-xs text-slate-400">
    <input type="checkbox" name="consent" required class="field-checkbox mt-0.5 border-white/20 bg-white/5">
    <span>{% translate "J'accepte de recevoir la newsletter. Désinscription en un clic." %}</span>
  </label>
</form>
