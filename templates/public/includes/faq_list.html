{# Two-column numbered accordion. Params: faqs, open_first #}
<div class="grid gap-4 lg:grid-cols-2" x-data="{ open: {% if open_first %}0{% else %}-1{% endif %} }">
  {% for faq in faqs %}
  <div class="h-fit rounded-xl border transition" :class="open === {{ forloop.counter0 }} ? 'border-primary bg-primary/[0.08]' : 'border-white/10 bg-white/[0.02]'">
    <h3>
      <button type="button" class="flex w-full items-center justify-between gap-6 px-6 py-5 text-left font-display text-lg" @click="open = open === {{ forloop.counter0 }} ? -1 : {{ forloop.counter0 }}" :aria-expanded="(open === {{ forloop.counter0 }}).toString()" aria-controls="faq-{{ faq.pk }}">
        <span><span class="text-primary-400">{{ forloop.counter|stringformat:"02d" }}.</span> {{ faq.question }}</span>
        <span class="grid size-8 shrink-0 place-items-center rounded-full border border-white/15 transition" :class="open === {{ forloop.counter0 }} && 'rotate-45 border-primary bg-primary'">{% icon "plus" "size-4" %}</span>
      </button>
    </h3>
    <div id="faq-{{ faq.pk }}" x-show="open === {{ forloop.counter0 }}" x-collapse {% if not open_first or not forloop.first %}x-cloak{% endif %}>
      <div class="prose-brand px-6 pb-6 text-[0.95rem]">{{ faq.answer|safe }}</div>
    </div>
  </div>
  {% endfor %}
</div>
