<span class="status-pill {% if status == 'new' %}bg-primary-50 text-primary-700 ring-primary-200{% elif status == 'in_progress' %}bg-amber-50 text-amber-700 ring-amber-200{% elif status == 'answered' %}bg-emerald-50 text-emerald-700 ring-emerald-200{% elif status == 'spam' %}bg-rose-50 text-rose-700 ring-rose-200{% else %}bg-slate-50 text-slate-600 ring-slate-200{% endif %}">{{ label }}</span>
