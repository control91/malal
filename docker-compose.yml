# Production stack. Usage: cp .env.example .env (fill it) && docker compose up -d --build
name: malal

x-app: &app
  build: { context: ., target: app }
  env_file: .env
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - storage:/var/www/html/storage/app

services:
  app:
    <<: *app
    environment: { RUN_MIGRATIONS: "1" }

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=4", "--backoff=30", "--max-time=3600"]
    healthcheck: { disable: true }

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck: { disable: true }

  ssr:
    build: { context: ., target: ssr }
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [app]
    ports: ["${HTTP_PORT:-80}:80"]
    volumes:
      - storage:/var/www/html/storage/app:ro

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-malal}
      POSTGRES_USER: ${DB_USERNAME:-malal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redis:
  storage:
