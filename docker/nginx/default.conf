# Nginx in front of PHP-FPM. TLS is expected to be terminated here (mount
# certificates) or by an upstream load balancer / Cloudflare.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 24m;
    server_tokens off;

    # Resolve "app" at request time (Docker DNS): a recreated app container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Hashed Vite assets: cache forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* ^/(fonts|img)/ { expires 30d; try_files $uri =404; }

    # Uploaded media: never executed.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        location ~* \.(php|phtml|phar|html?|js)$ { deny all; }
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
