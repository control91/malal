# Reverse proxy in front of Gunicorn. TLS is expected to be terminated here
# (mount certificates) or by an upstream load balancer / Cloudflare.
upstream django { server web:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
        # Never execute uploaded content.
        location ~* \.(php|py|sh|cgi|html?)$ { deny all; }
    }

    # /static/ is served by WhiteNoise (hashed, compressed, immutable cache headers).

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
}
