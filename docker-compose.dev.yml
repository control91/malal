# Full development stack in Docker, with live reload.
#
#   make up        (= docker compose -f docker-compose.dev.yml up --build)
#
#   Site ............ http://localhost:8000
#   Back-office ..... http://localhost:8000/admin
#   Emails (Mailpit)  http://localhost:8025
#
# Services only (PHP/Node on the host): docker compose -f docker-compose.dev.yml up -d db redis mailpit
name: malal-dev

x-laravel: &laravel
  build: { context: ., dockerfile: docker/dev.Dockerfile }
  volumes: [".:/app"]
  environment: &laravel-env
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:${DEV_PORT:-8000}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: malal
    DB_USERNAME: malal
    DB_PASSWORD: malal
    REDIS_HOST: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: "1025"
    INERTIA_SSR_ENABLED: "false"
    CSP_ENABLED: "false"
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  app:
    <<: *laravel
    environment: { <<: *laravel-env, RUN_MIGRATIONS: "1" }
    ports: ["${DEV_PORT:-8000}:8000"]

  worker:
    <<: *laravel
    command: ["php", "artisan", "queue:listen", "--tries=3"]

  vite:
    image: node:22-alpine
    working_dir: /app
    environment: { VITE_HOST: 0.0.0.0 }
    volumes:
      - .:/app
      # Linux node_modules kept apart from the host's (native binaries differ).
      - node-modules-dev:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    ports: ["5173:5173"]

  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: malal, POSTGRES_USER: malal, POSTGRES_PASSWORD: malal }
    ports: ["${DEV_DB_PORT:-55432}:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malal -d malal"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${DEV_REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["${DEV_MAIL_PORT:-8025}:8025"]

volumes:
  pgdata-dev:
  node-modules-dev:
