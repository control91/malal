# Base commune aux conteneurs PHP : une seule image construite, réutilisée partout
x-php: &php
  image: malal-app-dev:latest
  restart: unless-stopped
  working_dir: /var/www
  env_file:
    - .env
  volumes:
    - ./:/var/www
  networks:
    - mm_network

# Les workers attendent que les migrations soient passées
x-php-depends: &php-depends
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }

services:
  # Service à usage unique : dépendances + migrations, puis s'arrête
  migrate:
    <<: *php
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    container_name: mm_migrate
    restart: "no"
    command: >
      sh -c "[ -f vendor/autoload.php ] || composer install --no-interaction &&
             php artisan migrate --force"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  app:
    <<: *php
    container_name: mm_app
    depends_on: *php-depends

  queue:
    <<: *php
    container_name: mm_queue
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on: *php-depends

  scheduler:
    <<: *php
    container_name: mm_scheduler
    command: php artisan schedule:work
    depends_on: *php-depends

  reverb:
    <<: *php
    container_name: mm_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    ports:
      - "8081:8080"
    depends_on: *php-depends

  nginx:
    image: nginx:alpine
    container_name: mm_nginx
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mm_network

  postgres:
    image: postgres:17-alpine
    container_name: mm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mm_network

  redis:
    image: redis:alpine
    container_name: mm_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mm_network

  node:
    image: node:22-alpine
    container_name: mm_node
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    networks:
      - mm_network

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mm_mailpit
    restart: unless-stopped
    ports:
      - "${DEV_MAIL_PORT:-8025}:8025"
    networks:
      - mm_network

networks:
  mm_network:
    driver: bridge

volumes:
  postgres_data:
  node_modules:
