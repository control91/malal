# Local services only (Postgres + Redis); run Django with `python manage.py runserver`.
name: malal-dev
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: malal, POSTGRES_USER: malal, POSTGRES_PASSWORD: malal }
    ports: ["5433:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata-dev:
